<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<meta name="theme-color"
      content="#70c9f5">

<title>My Apple Catcher</title>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action:none;
}

body{
    background:#70c9f5;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

.hidden{
    display:none !important;
}


/* =====================================================
   WORLD
===================================================== */

#world{
    position:absolute;
    inset:0;

    overflow:hidden;

    background:
        linear-gradient(
            to bottom,
            #70c9f5 0%,
            #bcecff 53%,
            #70c96b 53%,
            #3f9d42 100%
        );
}


/* =====================================================
   SUN
===================================================== */

#sun{
    position:absolute;

    width:70px;
    height:70px;

    top:18px;
    right:30px;

    border-radius:50%;

    background:#ffd84d;

    box-shadow:
        0 0 35px
        rgba(255,216,77,.75);
}


/* =====================================================
   CLOUDS
===================================================== */

.cloud{
    position:absolute;

    width:90px;
    height:35px;

    background:white;

    border-radius:30px;

    opacity:.85;

    animation:
        cloudMove 18s ease-in-out infinite;
}

.cloud:before,
.cloud:after{
    content:"";

    position:absolute;

    background:white;

    border-radius:50%;
}

.cloud:before{
    width:45px;
    height:45px;

    left:15px;
    top:-22px;
}

.cloud:after{
    width:50px;
    height:50px;

    right:8px;
    top:-27px;
}

.cloud1{
    top:55px;
    left:30px;
}

.cloud2{
    top:125px;
    right:120px;

    transform:scale(.8);

    animation-duration:25s;
}

@keyframes cloudMove{

    50%{
        margin-left:25px;
    }

}


/* =====================================================
   TREE
===================================================== */

#tree{
    position:absolute;

    width:150px;
    height:260px;

    left:25px;
    bottom:80px;

    z-index:2;
}

#trunk{
    position:absolute;

    width:42px;
    height:145px;

    left:54px;
    bottom:0;

    background:
        linear-gradient(
            90deg,
            #63351e,
            #8c5430,
            #63351e
        );

    border-radius:10px;
}

.branch{
    position:absolute;

    width:20px;
    height:85px;

    background:#75452a;

    border-radius:10px;

    transform-origin:bottom;
}

.branch1{
    left:48px;
    bottom:105px;

    transform:rotate(-40deg);
}

.branch2{
    left:72px;
    bottom:105px;

    transform:rotate(40deg);
}

.leaf{
    position:absolute;

    width:90px;
    height:90px;

    background:
        linear-gradient(
            135deg,
            #38a94c,
            #167331
        );

    border-radius:50%;

    box-shadow:
        inset -8px -8px 0
        rgba(0,0,0,.08);
}

.leaf1{
    left:5px;
    top:40px;
}

.leaf2{
    left:55px;
    top:30px;
}

.leaf3{
    left:30px;
    top:0;
}

.leaf4{
    left:70px;
    top:75px;
}

.leaf5{
    left:-15px;
    top:90px;
}


/* =====================================================
   GROUND
===================================================== */

#ground{
    position:absolute;

    width:100%;
    height:80px;

    left:0;
    bottom:0;

    background:
        linear-gradient(
            #4ca64b,
            #318536
        );

    z-index:3;
}


/* =====================================================
   CONTROL BAR
===================================================== */

#controlBar{
    position:absolute;

    top:36px;
    left:50%;

    transform:translateX(-50%);

    width:90%;

    display:flex;

    justify-content:center;
    align-items:center;

    gap:3%;

    z-index:70;

    pointer-events:none;
}

.controlButton{
    border:0;

    border-radius:10px;

    padding:10px 11px;

    font-size:15px;
    font-weight:bold;

    background:white;
    color:#333;

    box-shadow:
        0 3px 0 #777;

    pointer-events:auto;

    touch-action:manipulation;

    white-space:nowrap;
}

.controlButton:active{
    transform:translateY(3px);

    box-shadow:
        0 1px 0 #777;
}


/* =====================================================
   SCORE
===================================================== */

#scoreArea{
    position:absolute;

    top:82px;
    left:50%;

    width:120px;

    transform:translateX(-100%);

    display:flex;

    justify-content:flex-end;
    align-items:center;

    padding-right:4px;

    z-index:50;

    color:white;

    font-weight:bold;

    text-shadow:
        2px 2px 4px #333;
}

#score{
    font-size:17px;

    white-space:nowrap;
}

#highScoreDisplay{
    position:absolute;

    top:82px;
    left:50%;

    width:120px;

    display:flex;

    justify-content:flex-start;
    align-items:center;

    padding-left:4px;

    z-index:50;

    color:white;

    font-size:17px;
    font-weight:bold;

    text-shadow:
        2px 2px 4px #333;

    white-space:nowrap;
}


/* =====================================================
   LEVEL
===================================================== */

#levelDisplay{
    position:absolute;

    top:108px;
    left:50%;

    transform:translateX(-50%);

    color:white;

    font-size:14px;
    font-weight:bold;

    text-shadow:
        2px 2px 4px #333;

    z-index:50;

    white-space:nowrap;
}


/* =====================================================
   LIVES
===================================================== */

#lives{
    position:absolute;

    top:80px;
    left:50%;

    transform:translateX(-100%);

    width:155px;

    font-size:30px;

    color:#ff3030;

    letter-spacing:2px;

    text-shadow:
        2px 2px 4px #333;

    z-index:50;
}

#lives span{
    display:inline-block;

    margin-right:2px;
}


/* =====================================================
   APPLE
===================================================== */

#apple{
    position:absolute;

    width:46px;
    height:46px;

    z-index:10;

    filter:
        drop-shadow(
            3px 5px 3px
            rgba(0,0,0,.25)
        );
}

.appleBody{
    position:absolute;

    width:42px;
    height:40px;

    left:2px;
    top:6px;

    border-radius:
        48% 48% 45% 45%;

    background:
        linear-gradient(
            135deg,
            #ff5a50,
            #d71920 65%,
            #a70e15
        );

    box-shadow:
        inset 7px 5px 0
        rgba(255,255,255,.18);
}

.appleLeaf{
    position:absolute;

    width:15px;
    height:8px;

    background:#26883a;

    border-radius:100% 0;

    top:0;
    right:2px;

    transform:rotate(-25deg);
}

.appleStem{
    position:absolute;

    width:5px;
    height:13px;

    background:#59331f;

    border-radius:5px;

    top:-3px;
    left:21px;
}


/* =====================================================
   BASKET
===================================================== */

#basket{
    position:absolute;

    width:82px;
    height:47px;

    bottom:30px;
    left:50%;

    transform:translateX(-50%);

    background:
        linear-gradient(
            #d28a3c,
            #a86128
        );

    border:
        5px solid #71421f;

    border-radius:
        8px 8px 25px 25px;

    z-index:15;

    box-shadow:
        0 4px 7px
        rgba(0,0,0,.25);
}

#basket:before{
    content:"";

    position:absolute;

    width:7px;
    height:38px;

    left:20px;
    top:-2px;

    background:#8e5828;

    box-shadow:
        15px 0 #8e5828,
        30px 0 #8e5828;
}


/* =====================================================
   PARTICLES
===================================================== */

.particle{
    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#ffd84d;

    pointer-events:none;

    z-index:60;

    animation:
        particle .6s ease-out forwards;
}

@keyframes particle{

    to{

        opacity:0;

        transform:
            translate(
                var(--dx),
                var(--dy)
            )
            scale(.1);

    }

}


/* =====================================================
   FLOATING SCORE
===================================================== */

.floatingScore{
    position:absolute;

    color:#fff;

    font-size:20px;
    font-weight:bold;

    text-shadow:
        2px 2px 3px #333;

    z-index:65;

    pointer-events:none;

    animation:
        floatScore .75s ease-out forwards;
}

@keyframes floatScore{

    to{

        opacity:0;

        transform:
            translateY(-45px)
            scale(1.2);

    }

}


/* =====================================================
   LEVEL FLASH
===================================================== */

.levelFlash{
    position:absolute;

    left:50%;
    top:43%;

    transform:
        translate(-50%,-50%);

    z-index:85;

    font-size:32px;
    font-weight:bold;

    color:#fff;

    text-shadow:
        0 3px 8px #333;

    pointer-events:none;

    animation:
        levelFlash .9s ease-out forwards;
}

@keyframes levelFlash{

    0%{

        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.5);

    }

    35%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.2);

    }

    100%{

        opacity:0;

        transform:
            translate(-50%,-65%)
            scale(1);

    }

}


/* =====================================================
   PAUSE
===================================================== */

#pauseMessage{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:90;

    padding:25px 35px;

    border-radius:15px;

    background:
        rgba(0,0,0,.75);

    color:white;

    font-size:30px;
    font-weight:bold;

    text-align:center;

    pointer-events:none;
}


/* =====================================================
   SCREENS
===================================================== */

.screen{
    position:absolute;

    inset:0;

    background:
        rgba(24,78,102,.93);

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    color:white;

    z-index:100;

    padding:20px;
}

.screen h1{
    font-size:40px;

    margin:8px;
}

.screen p{
    font-size:17px;

    margin:6px;
}

.screen button{
    border:0;

    border-radius:12px;

    padding:14px 34px;

    margin-top:14px;

    font-size:20px;
    font-weight:bold;

    background:#f5c542;

    color:#333;

    box-shadow:
        0 5px 0 #a27c14;

    touch-action:manipulation;
}

.modeButtons{
    display:flex;

    gap:8px;

    flex-wrap:wrap;

    justify-content:center;

    margin-top:12px;
}

.modeButton{
    padding:9px 12px !important;

    margin:0 !important;

    font-size:14px !important;

    background:#fff !important;

    box-shadow:
        0 3px 0 #777 !important;
}

.modeButton.selected{
    background:#f5c542 !important;
}

.creator{
    margin-top:20px;

    font-size:15px;

    opacity:.95;
}

#controls{
    margin-top:10px;

    font-size:13px;

    opacity:.85;
}


/* =====================================================
   RESULTS
===================================================== */

#resultsBox{
    width:min(90%,360px);

    padding:18px;

    margin-top:10px;

    border-radius:18px;

    background:
        rgba(0,0,0,.25);

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.2);
}

.resultRow{
    display:flex;

    justify-content:space-between;

    font-size:17px;

    font-weight:bold;

    margin:8px 0;
}

.achievement{
    font-size:15px;

    margin-top:10px;

    color:#ffe36b;

    font-weight:bold;
}

.homeButton{
    background:#ffffff !important;

    color:#333 !important;

    box-shadow:
        0 5px 0 #777 !important;
}


/* =====================================================
   SHAKE
===================================================== */

.shake{
    animation:
        shake .25s;
}

@keyframes shake{

    25%{
        transform:translateX(-5px);
    }

    75%{
        transform:translateX(5px);
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    #controlBar{
        top:36px;

        gap:3%;
    }

    .controlButton{
        padding:10px;

        font-size:15px;
    }

    #scoreArea,
    #highScoreDisplay{
        top:82px;
    }

    #levelDisplay{
        top:108px;
    }

    #lives{
        top:80px;
    }

    .screen h1{
        font-size:34px;
    }

    .screen p{
        font-size:16px;
    }

}


/* =====================================================
   SMALL PHONES
===================================================== */

@media(max-width:370px){

    .controlButton{
        padding:8px 7px;

        font-size:12px;
    }

    #controlBar{
        width:96%;
    }

    #lives{
        font-size:27px;
    }

    #score,
    #highScoreDisplay{
        font-size:15px;
    }

}

</style>

</head>

<script>

/* =====================================================

let score = 0;

/* =====================================================
   TIME RUSH SETTINGS
===================================================== */

/* =====================================================
   HIGH SCORE
===================================================== */

let highScore =
Number(

    ) || 0
);

highScoreText.textContent =

/* =====================================================
   MODE SELECTION
===================================================== */

modeButtons.forEach(button => {

    button.addEventListener(
        "click",
        function(){

            modeButtons.forEach(
                b => {

                    b.classList.remove(

            );

            button.classList.add(

            );

            selectedMode =

/* =====================================================
   AUDIO
===================================================== */

function getAudio(){

    if(!soundOn)
        return null;

    try{

        const AC =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AC)
            return null;

        if(!audioContext)
            audioContext =
                new AC();

        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext
                .resume()
                .catch(()=>{});

        }

        return audioContext;

    }
    catch(e){

        return null;

    }

}


function tone(
    freq,
    duration,
    type="sine",
    volume=.12
){

    const audio =
        getAudio();

    if(!audio)
        return;

    try{

        const osc =
            audio.createOscillator();

        const gain =
            audio.createGain();

        osc.type =
            type;

        osc.frequency.value =
            freq;

        gain.gain.setValueAtTime(
            volume,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audio.currentTime +
            duration
        );

        osc.connect(gain);

        gain.connect(
            audio.destination
        );

        osc.start();

        osc.stop(
            audio.currentTime +
            duration
        );

    }
    catch(e){}

}


function catchSound(){

    tone(
        650,
        .08,
        "sine",
        .14
    );

    setTimeout(
        () => {

            tone(
                900,
                .08,

        },

    );

}


function missSound(){

function levelSound(){

    setTimeout(
        () => {

            tone(
                180,
                .3,
                "triangle",
                .12
            );

        },
        330
    );

}


/* =====================================================
   MUSIC
===================================================== */

function startMusic(){

    if(!soundOn)
        return;

    stopMusic();

    const audio =
        getAudio();

    if(!audio)
        return;

    const notes = [

        261.63,
        329.63,
        392.00,
        523.25,
        392.00,
        329.63,
        293.66,
        349.23

    ];

    let index = 0;

    musicTimer =
        setInterval(
            () => {

                if(
                    !gameRunning ||
                    paused ||
                    !soundOn
                )
                    return;

                tone(
                    notes[
                        index %
                        notes.length
                    ],
                    .20,
                    "triangle",
                    .028
                );

                index++;

            },
            360
        );

}


function stopMusic(){

    if(musicTimer){

        clearInterval(
            musicTimer
        );

        musicTimer = null;

    }

}


/* =====================================================
   VIBRATION
===================================================== */

function vibrate(pattern){

    if(!vibrationOn)
        return;

    if(
        "vibrate" in navigator
    ){

        try{

            navigator.vibrate(
                pattern
            );

        }
        catch(e){}

    }

}


/* =====================================================
   LIVES
===================================================== */

function updateLives(){

    const hearts =
        livesContainer
        .querySelectorAll(
            "span"
        );

    hearts.forEach(
        (heart,index) => {

            heart.style.opacity =
                index < lives
                ? "1"
                : ".2";

        }
    );

}


/* =====================================================
   TIME RUSH SPEED
===================================================== */

function updateTimeRushSpeed(){

    /*
       LEVEL 1  = 1x
       LEVEL 2  = 2x
       LEVEL 3  = 3x
       ...
       LEVEL 25 = 25x
    */

    appleSpeed =
        timeRushLevel;

}


/* =====================================================
   LEVEL DISPLAY
===================================================== */

function updateLevelDisplay(){

    if(
        selectedMode === "time"
    ){

        levelDisplay.textContent =
            "Level " +
            timeRushLevel +
            "/25 • " +
            fallsThisLevel +
            "/10";

    }
    else if(
        selectedMode === "endless"
    ){

        levelDisplay.textContent =
            "ENDLESS";

    }
    else{

        levelDisplay.textContent =
            "Level " +
            level;

    }

}


/* =====================================================
   CLASSIC SPEED
===================================================== */

function updateClassicSpeed(){

    level =
        Math.floor(
            score / 10
        ) + 1;

    appleSpeed =
        3 +
        (level - 1) * .45;

}


/* =====================================================
   ENDLESS SPEED
===================================================== */

function updateEndlessSpeed(){

    /*
       Endless remains 4x.
    */

    appleSpeed = 4;

}


/* =====================================================
   LEVEL FLASH
===================================================== */

function showLevelUp(text){

    const el =
        document.createElement(
            "div"
        );

    el.className =
        "levelFlash";

    el.textContent =
        text;

    game.appendChild(el);

    setTimeout(
        () => {

            el.remove();

        },
        1000
    );

}


/* =====================================================
   BASKET
===================================================== */

function setBasketPosition(x){

    if(
        !gameRunning ||
        paused
    )
        return;

    const half =
        basket.offsetWidth / 2;

    basketX = x;

    basketX =
        Math.max(
            half,
            Math.min(
                innerWidth - half,
                basketX
            )
        );

    basket.style.left =
        basketX + "px";

}


/* =====================================================
   TOUCH / POINTER
===================================================== */

game.addEventListener(
    "pointerdown",
    e => {

        if(
            !gameRunning ||
            paused
        )
            return;

        if(
            e.target.closest("button")
        )
            return;

        setBasketPosition(
            e.clientX
        );

    }
);


game.addEventListener(
    "pointermove",
    e => {

        if(
            !gameRunning ||
            paused
        )
            return;

        if(
            e.target.closest("button")
        )
            return;

        setBasketPosition(
            e.clientX
        );

    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    e => {

        if(!gameRunning)
            return;

        if(
            e.key === "ArrowLeft"
        ){

            e.preventDefault();

            if(!paused){

                setBasketPosition(
                    basketX - 35
                );

            }

        }


        if(
            e.key === "ArrowRight"
        ){

            e.preventDefault();

            if(!paused){

                setBasketPosition(
                    basketX + 35
                );

            }

        }


        if(
            e.code === "Space"
        ){

            e.preventDefault();

            togglePause();

        }

    }
);


/* =====================================================
   APPLE TYPES
===================================================== */

function chooseAppleType(){

    const random =
        Math.random();

    if(
        random < .08
    ){

        appleType =
            "gold";

    }
    else if(
        random < .14
    ){

        appleType =
            "rotten";

    }
    else{

        appleType =
            "normal";

    }

    updateAppleAppearance();

}


function updateAppleAppearance(){

    const body =
        apple.querySelector(
            ".appleBody"
        );

    if(
        appleType === "gold"
    ){

        body.style.background =
            "linear-gradient(135deg,#fff08a,#ffc400,#e59a00)";

    }
    else if(
        appleType === "rotten"
    ){

        body.style.background =
            "linear-gradient(135deg,#8dca42,#557d24,#314b17)";

    }
    else{

        body.style.background =
            "linear-gradient(135deg,#ff5a50,#d71920 65%,#a70e15)";

    }

}


/* =====================================================
   NEW APPLE
===================================================== */

function newApple(){

    appleY = 100;

    const maxX =
        Math.max(
            10,
            innerWidth - 60
        );

    appleX =
        Math.random() *
        maxX;

    apple.style.left =
        appleX + "px";

    apple.style.top =
        appleY + "px";

    chooseAppleType();

}


/* =====================================================
   PARTICLES
===================================================== */

function particles(
    x,
    y,
    count=8
){

    for(
        let i=0;
        i<count;
        i++
    ){

        const p =
            document.createElement(
                "div"
            );

        p.className =
            "particle";

        p.style.left =
            x + "px";

        p.style.top =
            y + "px";

        const angle =
            Math.random() *
            Math.PI * 2;

        const distance =
            25 +
            Math.random() * 45;

        p.style.setProperty(
            "--dx",
            Math.cos(angle) *
            distance +
            "px"
        );

        p.style.setProperty(
            "--dy",
            Math.sin(angle) *
            distance +
            "px"
        );

        game.appendChild(p);

        setTimeout(
            () => {

                p.remove();

            },
            650
        );

    }

}


/* =====================================================
   FLOATING SCORE
===================================================== */

function floatingScore(
    x,
    y,
    text
){

    const el =
        document.createElement(
            "div"
        );

    el.className =
        "floatingScore";

    el.textContent =
        text;

    el.style.left =
        x + "px";

    el.style.top =
        y + "px";

    game.appendChild(el);

    setTimeout(
        () => {

            el.remove();

        },
        800
    );

}


/* =====================================================
   TIME RUSH FALL
===================================================== */

function completeTimeRushFall(){

    fallsThisLevel++;

    updateLevelDisplay();


    /*
       10 falls completed.
    */

    if(
        fallsThisLevel >=
        FALLS_PER_LEVEL
    ){

        /*
           LEVEL 25 COMPLETED
        */

        if(
            timeRushLevel >=
            TOTAL_TIME_LEVELS
        ){

            showLevelUp(
                "🏆 25 LEVELS COMPLETE!"
            );

            levelSound();

            setTimeout(
                () => {

                    endGame(true);

                },
                900
            );

            return;

        }


        /*
           NEXT LEVEL
        */

        timeRushLevel++;

        fallsThisLevel = 0;

        updateTimeRushSpeed();

        updateLevelDisplay();

        showLevelUp(
            "⚡ LEVEL " +
            timeRushLevel +
            " • " +
            timeRushLevel +
            "× SPEED!"
        );

        levelSound();

        vibrate(
            [50,50,100]
        );

    }

}


/* =====================================================
   CATCH APPLE
===================================================== */

function catchApple(){

    let points = 1;


    if(
        appleType === "gold"
    ){

        points = 3;

        particles(
            appleX + 20,
            appleY + 20,
            14
        );

        floatingScore(
            appleX,
            appleY,
            "+3 🍎"
        );

    }
    else if(
        appleType === "rotten"
    ){

        points = -1;

        particles(
            appleX + 20,
            appleY + 20,
            6
        );

        floatingScore(
            appleX,
            appleY,
            "-1"
        );

    }
    else{

        particles(
            appleX + 20,
            appleY + 20,
            8
        );

        floatingScore(
            appleX,
            appleY,
            "+1"
        );

    }


    score += points;

    if(score < 0)
        score = 0;


    scoreText.textContent =
        "Score: " +
        score;


    catchSound();

    vibrate(40);


    if(
        selectedMode === "time"
    ){

        completeTimeRushFall();

        if(!gameRunning)
            return;

    }
    else if(
        selectedMode === "classic"
    ){

        updateClassicSpeed();

    }
    else{

        updateEndlessSpeed();

    }


    updateLevelDisplay();

    newApple();

}


/* =====================================================
   MISSED APPLE
===================================================== */

function missApple(){

    /*
       TIME RUSH
    */

    if(
        selectedMode === "time"
    ){

        fallsThisLevel++;

        lives--;

        updateLives();

        missSound();

        vibrate(
            [100,60,100]
        );


        game.classList.remove(
            "shake"
        );

        void game.offsetWidth;

        game.classList.add(
            "shake"
        );


        if(
            lives <= 0
        ){

            endGame(false);

            return;

        }


        if(
            fallsThisLevel >=
            FALLS_PER_LEVEL
        ){

            if(
                timeRushLevel >=
                TOTAL_TIME_LEVELS
            ){

                showLevelUp(
                    "🏆 25 LEVELS COMPLETE!"
                );

                setTimeout(
                    () => {

                        endGame(true);

                    },
                    900
                );

                return;

            }


            timeRushLevel++;

            fallsThisLevel = 0;

            updateTimeRushSpeed();

            showLevelUp(
                "⚡ LEVEL " +
                timeRushLevel +
                " • " +
                timeRushLevel +
                "× SPEED!"
            );

            levelSound();

            vibrate(
                [50,50,100]
            );

        }


        updateLevelDisplay();

        newApple();

        return;

    }


    /*
       CLASSIC / ENDLESS
    */

    if(
        appleType !== "rotten"
    ){

        lives--;

        updateLives();

        missSound();

        vibrate(
            [100,60,100]
        );


        game.classList.remove(
            "shake"
        );

        void game.offsetWidth;

        game.classList.add(
            "shake"
        );


        if(
            lives <= 0
        ){

            endGame(false);

            return;

        }

    }


    newApple();

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(timestamp){

    if(!gameRunning)
        return;


    if(!lastTime)
        lastTime = timestamp;


    const delta =
        timestamp -
        lastTime;

    lastTime =
        timestamp;


    if(!paused){

        appleY +=
            appleSpeed *
            (delta / 16.67);

        apple.style.top =
            appleY + "px";


        const a =
            apple.getBoundingClientRect();

        const b =
            basket.getBoundingClientRect();


        /*
           COLLISION
        */

        if(

            a.bottom >= b.top &&
            a.top <= b.bottom &&
            a.right >= b.left &&
            a.left <= b.right

        ){

            catchApple();

        }


        /*
           MISSED
        */

        if(
            appleY >
            innerHeight
        ){

            missApple();

        }

    }


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

    if(!gameRunning)
        return;


    paused =
        !paused;


    if(paused){

        pauseButton.textContent =
            "RESUME";

        pauseMessage
            .classList
            .remove("hidden");

    }
    else{

        pauseButton.textContent =
            "PAUSE";

        pauseMessage
            .classList
            .add("hidden");

        lastTime = 0;

    }

}


/* =====================================================
   PAUSE BUTTON
===================================================== */

pauseButton.onclick =
function(e){

    e.preventDefault();

    e.stopPropagation();

    togglePause();

};


/* =====================================================
   SOUND BUTTON
===================================================== */

soundButton.onclick =
function(e){

    e.preventDefault();

    e.stopPropagation();


    soundOn =
        !soundOn;


    soundButton.textContent =
        soundOn
        ? "SOUND ON"
        : "SOUND OFF";


    if(soundOn){

        getAudio();

        if(gameRunning)
            startMusic();

    }
    else{

        stopMusic();

    }

};


/* =====================================================
   VIBRATION BUTTON
===================================================== */

vibrationButton.onclick =
function(e){

    e.preventDefault();

    e.stopPropagation();


    vibrationOn =
        !vibrationOn;


    vibrationButton.textContent =
        vibrationOn
        ? "VIBRATE ON"
        : "VIBRATE OFF";


    if(vibrationOn){

        vibrate(
            [70,40,70]
        );

    }

};


/* =====================================================
   ACHIEVEMENT
===================================================== */

function getAchievement(){

    if(
        selectedMode === "time" &&
        timeRushLevel >= 25
    ){

        return "🏆 TIME RUSH MASTER!";

    }

    if(score >= 100)
        return "🏆 APPLE MASTER! 100+ points!";

    if(score >= 50)
        return "🌟 AMAZING CATCHER! 50+ points!";

    if(score >= 25)
        return "🍎 APPLE PRO! 25+ points!";

    if(score >= 10)
        return "⭐ GREAT START! 10+ points!";

    if(score > 0)
        return "🍎 First apples caught!";

    return "Keep practicing!";

}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    score = 0;

    lives = 3;

    level = 1;

    timeRushLevel = 1;

    fallsThisLevel = 0;

    paused = false;

    gameRunning = true;

    lastTime = 0;


    /*
       MODE SPEED
    */

    if(
        selectedMode === "time"
    ){

        appleSpeed = 1;

    }
    else if(
        selectedMode === "endless"
    ){

        appleSpeed = 4;

    }
    else{

        appleSpeed = 3;

    }


    scoreText.textContent =
        "Score: 0";


    updateLives();

    updateLevelDisplay();


    pauseButton.textContent =
        "PAUSE";


    pauseMessage
        .classList
        .add("hidden");


    startScreen
        .classList
        .add("hidden");


    gameOverScreen
        .classList
        .add("hidden");


    gameOverTitle.textContent =
        "🏆 Game Over";


    basketX =
        innerWidth / 2;

    basket.style.left =
        basketX + "px";


    newApple();


    getAudio();

    startMusic();


    if(
        animationFrame !== null
    ){

        cancelAnimationFrame(
            animationFrame
        );

    }


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );


    enterFullscreen();

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(completed=false){

    if(!gameRunning)
        return;


    gameRunning = false;

    paused = false;

    stopMusic();


    if(completed){

        gameOverTitle.textContent =
            "🏆 TIME RUSH COMPLETE!";

        vibrate(
            [100,60,100,60,200]
        );

    }
    else{

        gameOverTitle.textContent =
            "🏆 Game Over";

        gameOverSound();

        vibrate(
            [150,80,150]
        );

    }


    if(
        animationFrame !== null
    ){

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;

    }


    /*
       HIGH SCORE
    */

    if(
        score > highScore
    ){

        highScore =
            score;

        localStorage.setItem(
            "myAppleCatcherHighScore",
            highScore
        );

    }


    highScoreText.textContent =
        "Best: " +
        highScore;


    finalScore.textContent =
        score;


    finalBest.textContent =
        highScore;


    if(
        selectedMode === "time"
    ){

        finalLevel.textContent =
            timeRushLevel +
            " / " +
            TOTAL_TIME_LEVELS;

    }
    else if(
        selectedMode === "classic"
    ){

        finalLevel.textContent =
            level;

    }
    else{

        finalLevel.textContent =
            "—";

    }


    finalMode.textContent =
        selectedMode === "classic"
        ? "Classic"
        : selectedMode === "time"
        ? "Time Rush"
        : "Endless";


    achievementText.textContent =
        getAchievement();


    gameOverScreen
        .classList
        .remove("hidden");

}


/* =====================================================
   FULLSCREEN
===================================================== */

function enterFullscreen(){

    try{

        if(
            document
            .documentElement
            .requestFullscreen
        ){

            document
            .documentElement
            .requestFullscreen()
            .catch(
                () => {}
            );

        }

    }
    catch(e){}

}


/* =====================================================
   START BUTTON
===================================================== */

startButton.onclick =
function(e){

    e.preventDefault();

    e.stopPropagation();

    startGame();

};


/* =====================================================
   RESTART BUTTON
===================================================== */

restartButton.onclick =
function(e){

    e.preventDefault();

    e.stopPropagation();

    startGame();

};


/* =====================================================
   ⭐ BACK TO GAME HOMEPAGE ⭐
===================================================== */

homeButton.onclick =
function(e){

    e.preventDefault();

    e.stopPropagation();


    /*
       IMPORTANT FIX
       ----------------

       DO NOT use:

       window.location.href = "/";

       That sends the player to the
       Netlify root and can make the
       game/app appear to disappear.

       Instead we return to the game's
       own START SCREEN.
    */


    gameRunning = false;

    paused = false;

    stopMusic();


    if(
        animationFrame !== null
    ){

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;

    }


    pauseMessage
        .classList
        .add("hidden");


    gameOverScreen
        .classList
        .add("hidden");


    startScreen
        .classList
        .remove("hidden");


    /*
       Reset the game display.
    */

    score = 0;

    lives = 3;

    level = 1;

    timeRushLevel = 1;

    fallsThisLevel = 0;


    scoreText.textContent =
        "Score: 0";


    updateLives();

    updateLevelDisplay();


    pauseButton.textContent =
        "PAUSE";


    /*
       Put basket back in center.
    */

    basketX =
        innerWidth / 2;

    basket.style.left =
        basketX + "px";


    /*
       Put apple back at top.
    */

    newApple();

};


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        const half =
            basket.offsetWidth / 2;

        basketX =
            Math.max(
                half,
                Math.min(
                    innerWidth - half,
                    basketX
                )
            );

        basket.style.left =
            basketX + "px";

    }
);


/* =====================================================
   INITIAL
===================================================== */

updateLives();

updateLevelDisplay();

newApple();

</script>
