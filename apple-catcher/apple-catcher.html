<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<meta name="theme-color" content="#70c9f5">

<title>My Apple Catcher</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#70c9f5;
}

body{
    overflow-x:hidden;
}

.page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px 15px;
}

.card{
    width:min(92%,520px);
    background:rgba(255,255,255,.96);
    border-radius:28px;
    padding:32px 24px;
    text-align:center;
    box-shadow:0 15px 45px rgba(0,0,0,.22);
}

.logo{
    font-size:70px;
    margin-bottom:5px;
}

h1{
    margin:0;
    color:#1f5f39;
    font-size:38px;
}

.subtitle{
    color:#555;
    font-size:17px;
    margin:10px 0 25px;
}

.game-image{
    width:100%;
    max-width:400px;
    height:180px;
    margin:0 auto 25px;

    border-radius:20px;

    background:
        linear-gradient(
            to bottom,
            #70c9f5 0%,
            #bcecff 55%,
            #4ca64b 55%,
            #318536 100%
        );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:65px;

    box-shadow:
        inset 0 0 0 3px
        rgba(255,255,255,.35);
}

.download{
    display:block;
    width:100%;

    padding:16px 20px;

    margin:12px 0;

    border-radius:15px;

    background:#38a94c;
    color:white;

    font-size:19px;
    font-weight:bold;

    text-decoration:none;

    box-shadow:
        0 5px 0 #237631;

    transition:.15s;
}

.download:active{
    transform:translateY(4px);
    box-shadow:
        0 1px 0 #237631;
}

.home{
    display:block;
    width:100%;

    padding:14px 20px;

    margin-top:14px;

    border-radius:15px;

    background:#eeeeee;
    color:#333;

    font-size:17px;
    font-weight:bold;

    text-decoration:none;

    box-shadow:
        0 4px 0 #999;
}

.home:active{
    transform:translateY(3px);
    box-shadow:
        0 1px 0 #999;
}

.info{
    margin-top:22px;

    padding:15px;

    border-radius:15px;

    background:#f2f8f3;

    color:#555;

    font-size:14px;

    line-height:1.6;
}

.creator{
    margin-top:22px;

    color:#555;

    font-size:14px;
}

.creator b{
    color:#1f5f39;
}

.hidden{
    display:none !important;
}


/* =========================
   GAME HOME SCREEN
========================= */

#gameHome{
    min-height:100vh;

    background:
        linear-gradient(
            to bottom,
            #70c9f5 0%,
            #bcecff 53%,
            #70c96b 53%,
            #3f9d42 100%
        );

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.game-home-box{
    width:min(92%,420px);

    padding:30px 22px;

    border-radius:25px;

    background:
        rgba(24,78,102,.94);

    color:white;

    text-align:center;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.25);
}

.game-home-box h2{
    font-size:34px;
    margin:5px 0 10px;
}

.game-home-box p{
    font-size:16px;
    margin:8px 0 22px;
}

.game-home-box button{
    border:0;

    border-radius:13px;

    padding:14px 25px;

    margin:7px;

    font-size:17px;
    font-weight:bold;

    background:#f5c542;

    color:#333;

    box-shadow:
        0 4px 0 #a27c14;
}

.game-home-box button:active{
    transform:translateY(3px);

    box-shadow:
        0 1px 0 #a27c14;
}

.back-to-site{
    background:white !important;
    color:#333 !important;

    box-shadow:
        0 4px 0 #777 !important;
}

@media(max-width:400px){

    h1{
        font-size:32px;
    }

    .logo{
        font-size:60px;
    }

    .card{
        padding:27px 18px;
    }

}

</style>
</head>

<body>

<!-- ==================================================
     WEBSITE / APP DOWNLOAD PAGE
================================================== -->

<div id="downloadPage" class="page">

    <div class="card">

        <div class="logo">
            🍎
        </div>

        <h1>
            My Apple Catcher
        </h1>

        <div class="subtitle">
            Catch the falling apples and beat your best score!
        </div>

        <div class="game-image">
            🍎 🧺 🍎
        </div>


        <!-- ==================================================
             WORKING APK DOWNLOAD
             
             IMPORTANT:
             The APK MUST be in the SAME folder as this Index.html
        =================================================== -->

        <a
            class="download"
            href="./My_Apple_Catcher_v3.0_1786445936950.apk"
            download="My_Apple_Catcher_v3.0_1786445936950.apk">

            📱 DOWNLOAD APK

        </a>


        <div class="info">

            <b>Android Game</b><br>

            Version 3.0<br>

            Offline gameplay<br>

            Catch apples • Earn points • Beat your record

        </div>


        <!-- ==================================================
             BACK TO HOMEPAGE
             
             IMPORTANT:
             This goes to your COLLECTION homepage.
             
             Change ONLY the URL below if your actual
             homepage URL is different.
        =================================================== -->

        <a
            class="home"
            href="https://smilinggirl946-cmyk.github.io/FarihaZahinCollection/">

            ⌂ BACK TO HOMEPAGE

        </a>


        <div class="creator">

            Developed by
            <b>Fariha Zahin</b>

        </div>

    </div>

</div>


<!-- ==================================================
     GAME'S OWN HOME SCREEN
     
     This is kept separate so the game itself can return
     to its own homepage without going to the website root.
================================================== -->

<div id="gameHome">

    <div class="game-home-box">

        <div style="font-size:65px;">
            🍎
        </div>

        <h2>
            My Apple Catcher
        </h2>

        <p>
            Catch the falling apples!
        </p>

        <button
            id="playAgainButton">

            ▶ PLAY GAME

        </button>

        <button
            class="back-to-site"
            id="backToWebsiteButton">

            ⌂ BACK TO WEBSITE

        </button>

    </div>

</div>


<script>

/* =====================================================
   SAFE APK DOWNLOAD
===================================================== */

const apkLink =
    document.querySelector(".download");

apkLink.addEventListener(
    "click",
    function(){

        /*
         * The browser will use the exact relative path:
         *
         * ./My_Apple_Catcher_v3.0_1786445936950.apk
         *
         * No GitHub "blob" URL is used.
         * No EXE is involved.
         */

        console.log(
            "APK download requested."
        );

    }
);


/* =====================================================
   BACK TO WEBSITE
===================================================== */

const backToWebsiteButton =
    document.getElementById(
        "backToWebsiteButton"
    );

backToWebsiteButton.onclick =
function(){

    window.location.href =
        "https://smilinggirl946-cmyk.github.io/FarihaZahinCollection/";

};


/* =====================================================
   PLAY AGAIN
===================================================== */

const playAgainButton =
    document.getElementById(
        "playAgainButton"
    );

playAgainButton.onclick =
function(){

    /*
     * Reload this page so the game can start
     * from its normal game homepage.
     */

    window.location.reload();

};


/* =====================================================
   IMPORTANT:
   DO NOT USE window.location.href = "/"
   FOR THE GAME'S BACK BUTTON.
===================================================== */

</script>

</body>
</html>
