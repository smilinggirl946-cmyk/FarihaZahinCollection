name: Build KidVerse for macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

     - name: Show project files
  run: |
    pwd
    ls -la

- name: Install dependencies
  run: npm install 

      - name: Build macOS app
        run: npx electron-builder --mac dmg --publish never

      - name: Upload macOS build to release
        run: gh release upload v1.0.0 dist/*.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
