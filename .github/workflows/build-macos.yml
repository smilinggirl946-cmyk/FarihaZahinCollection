name: Build KidVerse for macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: KidVerse

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: KidVerse/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app
        run: npx electron-builder --mac --publish never

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: KidVerse-macOS
          path: KidVerse/dist/*
