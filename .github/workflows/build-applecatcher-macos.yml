name: Build Apple Catcher macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: apple-catcher

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apple-catcher/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build macOS DMG
        run: npx electron-builder --mac dmg --publish never

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Catcher-macOS
          path: apple-catcher/dist/*.dmg
          if-no-files-found: error
