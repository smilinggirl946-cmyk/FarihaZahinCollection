name: Build Apple Catcher macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: apple-catcher

      - name: Build macOS DMG
        run: npx electron-builder --mac dmg --publish never
        working-directory: apple-catcher

          - name: Upload DMG to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view apple-catcher-v3.0.0 >/dev/null 2>&1 || gh release create apple-catcher-v3.0.0 --title "Apple Catcher v3.0.0" --notes "Apple Catcher v3.0.0 macOS release"
          gh release upload apple-catcher-v3.0.0 apple-catcher/dist/*.dmg --clobber
