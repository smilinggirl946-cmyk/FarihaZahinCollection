name: Build KidVerse macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npx electron-builder --mac dmg --universal

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: KidVerse-macOS
          path: dist/*.dmg
