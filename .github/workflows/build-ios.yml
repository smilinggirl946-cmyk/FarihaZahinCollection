name: Build KidVerse for iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: KidVerse

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: KidVerse/package-lock.json

      - name: Install Capacitor iOS
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest

      - name: Verify Capacitor configuration
        run: |
          pwd
          ls -la
          cat capacitor.config.json

      - name: Add iOS platform
        run: |
          npx cap add ios --packagemanager SPM

      - name: Sync iOS project
        run: |
          npx cap sync ios

      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package iOS Simulator
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r ../../../../KidVerse-iOS-Simulator.zip App.app

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: KidVerse-iOS-Simulator
          path: KidVerse/KidVerse-iOS-Simulator.zip
